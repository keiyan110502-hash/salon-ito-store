<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>salon ito Online Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="salon ito のオンラインストア。サロンで使用しているスキンケア・ヘアケア商品をご自宅へお届けします。">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<!--PREVIEW_BAR-->
<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#shop" aria-label="salon ito トップへ">
      <span class="logo-en">salon ito</span>
      <span class="logo-sub">Online Store</span>
    </a>
    <nav class="hnav" aria-label="メインメニュー">
      <button type="button" class="search-toggle" id="searchToggle" aria-expanded="false" aria-controls="searchPanel"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg><span>検索</span></button>
      <a href="#items" class="hn-items">商品一覧</a>
      <a href="#mypage">マイページ</a>
      <a href="#cart" class="cart-link">カート<span class="dot" id="badge" hidden>0</span></a>
    </nav>
  </div>
  <div class="search-panel" id="searchPanel" hidden>
    <div class="wrap">
      <label class="gsearch"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg><span class="visually-hidden">商品を検索</span><input id="gq" type="search" enterkeyhint="search" autocomplete="off" placeholder="商品名・カテゴリ・お悩みで検索"></label>
      <div class="gs-suggest" id="gsSuggest"></div>
    </div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot">
  <div class="wrap foot-in">
    <svg class="foot-thread" viewBox="0 0 240 24" aria-hidden="true"><path d="M0 14 C40 14 60 6 92 10 C110 12 112 22 102 21 C92 20 96 6 116 8 C150 11 190 16 240 12"/></svg>
    <p class="logo-en small">salon ito</p>
    <nav class="foot-nav" aria-label="ご利用案内">
      <a href="#guide">ご利用ガイド</a>
      <a href="#tokushoho">特定商取引法に基づく表記</a>
      <a href="#privacy">プライバシーポリシー</a>
      <a href="#mypage">マイページ</a>
    </nav>
    <p class="copy">© salon ito</p>
  </div>
</footer>

<div class="toast" id="toast" role="status" hidden></div>

<script src="assets/app.js"></script>
</body>
</html>
